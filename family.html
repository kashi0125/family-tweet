<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとこと便り（家族用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEAE0; --card: #FBF8F2; --ink: #2E2A25;
    --ink-soft: #6B6459; --line: #DCD3C0; --accent: #2F6259;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Zen Maru Gothic", sans-serif; padding: 20px; }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 900; margin: 4px 0; }
  .sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 18px; }
  .center-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px;
    max-width: 340px; margin: 40px auto; text-align: center;
  }
  .center-card p { font-size: 14px; color: var(--ink-soft); line-height: 1.7; }
  button.google-btn, button.admin-btn {
    font-family: inherit; font-size: 15px; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 11px 20px; cursor: pointer;
  }
  .throwback-heading { font-size: 13px; font-weight: 700; color: var(--accent); margin: 0 0 8px; }
  .feed { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .post-card {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--tag, var(--accent));
    border-radius: 10px; padding: 12px 14px;
  }
  .meta { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .name { font-weight: 700; font-size: 14px; color: var(--tag, var(--accent)); }
  .time { font-size: 12px; color: var(--ink-soft); }
  .text { font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 40px 12px; }
  #app, #pending, #adminPanel { display: none; }
  .admin-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 24px;
  }
  .admin-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; gap: 10px;
  }
  .admin-row:last-child { border-bottom: none; }
  .admin-row .email { word-break: break-all; }
  .admin-row button {
    font-family: inherit; font-size: 12px; font-weight: 700; border: none; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .approve-btn { background: var(--accent); color: #fff; }
  .revoke-btn { background: transparent; color: var(--ink-soft); border: 1px solid var(--line) !important; }
  .status-tag { font-size: 11px; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="center-card" id="loginCard">
    <h1>ひとこと便り</h1>
    <p class="sub">家族用ページ</p>
    <button class="google-btn" id="loginBtn">Googleでログイン</button>
  </div>

  <div class="center-card" id="pending">
    <h1>ひとこと便り</h1>
    <p>ログインありがとうございます。<br>まだ閲覧の承認待ちです。<br>カーシーさんに承認をお願いしてください。</p>
    <p id="pendingEmail" style="font-weight:700;"></p>
  </div>

  <div class="wrap" id="app">
    <h1>ひとこと便り</h1>
    <p class="sub">1週間経って届いた、みんなのつぶやき</p>

    <div class="admin-card" id="adminPanel">
      <p class="throwback-heading" style="margin-bottom:10px;">閲覧できる人の管理</p>
      <div id="adminList"></div>
    </div>

    <div id="throwback"></div>
    <div id="feed"><div class="empty">読み込み中…</div></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // ここをカーシーさんのGoogleアカウントのメールアドレスに変更してください。
  // このアドレスでログインした人だけが「閲覧できる人の管理」画面を使えます。
  const ADMIN_EMAIL = "kashi0125@gmail.com";

  const auth = firebase.auth();
  const db = firebase.firestore();

  const loginCard = document.getElementById('loginCard');
  const pending = document.getElementById('pending');
  const pendingEmail = document.getElementById('pendingEmail');
  const app = document.getElementById('app');
  const adminPanel = document.getElementById('adminPanel');
  const adminList = document.getElementById('adminList');
  const feed = document.getElementById('feed');
  const throwback = document.getElementById('throwback');

  document.getElementById('loginBtn').addEventListener('click', () => {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  });

  function startOfDay(ts) { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function daysAgo(ts) { return Math.round((startOfDay(Date.now()) - startOfDay(ts)) / 86400000); }
  function yearsAgo(ts) {
    const d = new Date(ts), now = new Date();
    let y = now.getFullYear() - d.getFullYear();
    if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) y--;
    return y;
  }
  function isAnniversaryToday(ts) {
    const d = new Date(ts), now = new Date();
    return d.getMonth() === now.getMonth() && d.getDate() === now.getDate() && yearsAgo(ts) >= 1;
  }
  function tagColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return `hsl(${h}, 45%, 40%)`;
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function postedOnLabel(ts) {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()}のつぶやき`;
  }
  function cardHtml(p, timeLabel) {
    return `
      <div class="post-card" style="--tag:${tagColor(p.name || '')}">
        <div class="meta"><span class="name">${esc(p.name || '名無し')}</span><span class="time">${timeLabel}</span></div>
        <div class="text">${esc(p.text || '')}</div>
      </div>`;
  }

  function renderFeed(posts) {
    const throwbacks = posts.filter(p => isAnniversaryToday(p.timestamp)).sort((a, b) => b.timestamp - a.timestamp);
    throwback.innerHTML = throwbacks.length
      ? '<p class="throwback-heading">1年前の今日のつぶやき</p><div class="feed">' +
        throwbacks.map(p => cardHtml(p, `${yearsAgo(p.timestamp)}年前のつぶやき`)).join('') + '</div>'
      : '';

    const week = posts.filter(p => daysAgo(p.timestamp) === 7).sort((a, b) => b.timestamp - a.timestamp);
    feed.innerHTML = week.length
      ? week.map(p => cardHtml(p, postedOnLabel(p.timestamp))).join('')
      : (throwbacks.length ? '' : '<div class="empty">今日届いているつぶやきはありません。</div>');
  }

  function renderAdmin(users) {
    adminList.innerHTML = users.map(u => `
      <div class="admin-row">
        <span class="email">${esc(u.email || '')}<br><span class="status-tag">${u.approved ? '許可済み' : '承認待ち'}</span></span>
        ${u.approved
          ? `<button class="revoke-btn" data-id="${u.id}" data-action="revoke">取り消す</button>`
          : `<button class="approve-btn" data-id="${u.id}" data-action="approve">許可する</button>`}
      </div>
    `).join('') || '<p style="font-size:13px;color:var(--ink-soft);">まだ誰もログインしていません。</p>';

    adminList.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const approve = btn.dataset.action === 'approve';
        db.collection('allowed_users').doc(id).update({ approved: approve });
      });
    });
  }

  auth.onAuthStateChanged(async user => {
    loginCard.style.display = 'none';
    pending.style.display = 'none';
    app.style.display = 'none';
    adminPanel.style.display = 'none';

    if (!user) {
      loginCard.style.display = 'block';
      return;
    }

    const isAdmin = user.email === ADMIN_EMAIL;
    const ref = db.collection('allowed_users').doc(user.uid);
    const snap = await ref.get();

    if (!snap.exists) {
      await ref.set({ email: user.email, approved: isAdmin, addedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }

    const approved = isAdmin || (snap.exists && snap.data().approved);

    if (!approved && !isAdmin) {
      pending.style.display = 'block';
      pendingEmail.textContent = user.email;
      return;
    }

    app.style.display = 'block';

    if (isAdmin) {
      adminPanel.style.display = 'block';
      db.collection('allowed_users').onSnapshot(snap => {
        renderAdmin(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      });
    }

    db.collection('posts').orderBy('timestamp', 'desc').limit(500).onSnapshot(snap => {
      const posts = snap.docs.map(d => {
        const data = d.data();
        const ts = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate().getTime() : Date.now();
        return { id: d.id, name: data.name, text: data.text, timestamp: ts };
      });
      renderFeed(posts);
    });
  });
</script>
</body>
</html>
