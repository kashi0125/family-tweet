<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひとこと便り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEAE0; --card: #FBF8F2; --ink: #2E2A25;
    --ink-soft: #6B6459; --line: #DCD3C0; --accent: #2F6259;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: "Zen Maru Gothic", sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { margin-bottom: 18px; }
  h1 { font-size: 22px; font-weight: 900; margin: 4px 0 2px; letter-spacing: .02em; }
  .sub { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin-bottom: 18px; }
  label { font-size: 13px; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  input, textarea {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    background: #fff; margin-bottom: 14px;
  }
  textarea { min-height: 90px; resize: vertical; }
  button.post {
    display: block; margin-left: auto;
    font-family: inherit; font-size: 15px; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 12px 28px; cursor: pointer;
  }
  button.post:disabled { opacity: .5; }
  .msg { margin-top: 14px; font-size: 13px; color: var(--accent); text-align: center; min-height: 16px; }

  .login-link { text-align: center; margin: 18px 0; }
  .login-link button {
    font-family: inherit; font-size: 12px; color: var(--ink-soft);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; cursor: pointer;
  }
  .pending-box {
    text-align: center; font-size: 13px; color: var(--ink-soft); line-height: 1.7;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 18px;
  }

  .throwback-heading { font-size: 13px; font-weight: 700; color: var(--accent); margin: 0 0 8px; }
  .feed { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .post-card {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--tag, var(--accent));
    border-radius: 10px; padding: 12px 14px;
  }
  .meta { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  .name { font-weight: 700; font-size: 14px; color: var(--tag, var(--accent)); }
  .time { font-size: 12px; color: var(--ink-soft); }
  .text { font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 40px 12px; }

  .admin-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 24px;
  }
  .admin-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; gap: 10px;
  }
  .admin-row:last-child { border-bottom: none; }
  .admin-row .email { word-break: break-all; }
  .admin-row button {
    font-family: inherit; font-size: 12px; font-weight: 700; border: none; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .approve-btn { background: var(--accent); color: #fff; }
  .revoke-btn { background: transparent; color: var(--ink-soft); border: 1px solid var(--line) !important; }
  .status-tag { font-size: 11px; color: var(--ink-soft); }
  .flower-caption { font-size: 12px; color: var(--ink-soft); margin: 6px 0 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ひとこと便り</h1>
      <p class="sub">つぶやいたことは、来週の今ごろに、そっとここに届きます。<br>誰がつぶやいたかは残りません。<br>家族以外の人でもつぶやけますが、家族以外の人はつぶやきを見ることはできません。</p>
    </header>

    <div class="card">
      <label>ひとこと</label>
      <textarea id="text" maxlength="500" placeholder="いま思ったこと、なんでも"></textarea>
      <button class="post" id="btn">つぶやく</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="login-link" id="loginLink">
      <button id="loginBtn">家族の方はこちら（ログイン）</button>
    </div>

    <div class="pending-box" id="pendingBox" style="display:none;">
      ログインありがとうございます。<br>管理者の承認後に閲覧が可能になります。
    </div>

    <div class="login-link" id="logoutLink" style="display:none;">
      <button id="logoutBtn">ログアウト</button>
    </div>

    <div id="flowerBox" style="display:none;text-align:center;margin-bottom:20px;"></div>

    <div id="feed"></div>
    <div id="throwback"></div>

    <div id="adminPanel" class="admin-card" style="display:none;">
      <p class="throwback-heading" style="margin-bottom:10px;">閲覧できる人の管理</p>
      <div id="adminList"></div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // ここをカーシーさんのGoogleアカウントのメールアドレスに変更してください。
  const ADMIN_EMAIL = "kashi0125@gmail.com";

  const auth = firebase.auth();
  const db = firebase.firestore();

  const textEl = document.getElementById('text');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  btn.addEventListener('click', async () => {
    const text = textEl.value.trim();
    if (!text) {
      msg.textContent = 'ひとことを入力してください。';
      return;
    }
    btn.disabled = true;
    msg.textContent = '送信中…';
    try {
      await db.collection('posts').add({
        text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      textEl.value = '';
      msg.textContent = '送信完了しました';
    } catch (e) {
      msg.textContent = '送信に失敗しました。もう一度お試しください。';
    }
    btn.disabled = false;
  });

  const loginLink = document.getElementById('loginLink');
  const logoutLink = document.getElementById('logoutLink');
  const pendingBox = document.getElementById('pendingBox');
  const adminPanel = document.getElementById('adminPanel');
  const adminList = document.getElementById('adminList');
  const feed = document.getElementById('feed');
  const throwback = document.getElementById('throwback');
  const flowerBox = document.getElementById('flowerBox');

  document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

  document.getElementById('loginBtn').addEventListener('click', () => {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
      console.error(err);
      pendingBox.style.display = 'block';
      pendingBox.textContent = '初ログインの場合は、管理者の承認を得た後に閲覧が可能になります。未承認でも投稿は可能です。';
    });
  });

  function startOfDay(ts) { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function daysAgo(ts) { return Math.round((startOfDay(Date.now()) - startOfDay(ts)) / 86400000); }
  function yearsAgo(ts) {
    const d = new Date(ts), now = new Date();
    let y = now.getFullYear() - d.getFullYear();
    if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) y--;
    return y;
  }
  function isAnniversaryToday(ts) {
    const d = new Date(ts), now = new Date();
    return d.getMonth() === now.getMonth() && d.getDate() === now.getDate() && yearsAgo(ts) >= 1;
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function postedOnLabel(ts) {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()}のつぶやき`;
  }
  function cardHtml(p, timeLabel) {
    return `
      <div class="post-card">
        <div class="meta"><span class="time">${timeLabel}</span></div>
        <div class="text">${esc(p.text || '')}</div>
      </div>`;
  }
  let isAdminViewer = false;

  function renderFeed(posts) {
    const throwbacks = posts.filter(p => isAnniversaryToday(p.timestamp)).sort((a, b) => yearsAgo(a.timestamp) - yearsAgo(b.timestamp) || b.timestamp - a.timestamp);
    throwback.innerHTML = throwbacks.length
      ? '<p class="throwback-heading">1年前の今日のつぶやき</p><div class="feed">' +
        throwbacks.map(p => cardHtml(p, `${yearsAgo(p.timestamp)}年前のつぶやき`)).join('') + '</div>'
      : '';
    const pendingCount = posts.filter(p => daysAgo(p.timestamp) < 7).length;
    const pendingLine = isAdminViewer ? `<p class="throwback-heading">公開待ちのつぶやき（${pendingCount}件）</p>` : '';
    const week = posts.filter(p => daysAgo(p.timestamp) === 7).sort((a, b) => b.timestamp - a.timestamp);
    feed.innerHTML = pendingLine + (week.length
      ? '<div class="feed">' + week.map(p => cardHtml(p, postedOnLabel(p.timestamp))).join('') + '</div>'
      : (throwbacks.length ? '' : '<div class="empty">今日届いているつぶやきはありません。</div>'));
    renderFlower(pendingCount);
  }

  function flowerSvg(stage) {
    // stage: 0=枯れかけ 1=つぼみ 2=咲きはじめ 3=満開
    const stems = {
      0: 'M60 100 Q56 70 62 46',
      1: 'M60 100 Q58 68 60 44',
      2: 'M60 100 Q60 66 60 40',
      3: 'M60 100 Q60 64 60 36'
    };
    const petalColors = { 0: '#B7A98F', 1: '#9BB79E', 2: '#6FA89B', 3: '#2F6259' };
    const centerColors = { 0: '#8F866F', 1: '#D8C77A', 2: '#E8B23D', 3: '#E8A33D' };
    const leafOpacity = { 0: 0.35, 1: 0.6, 2: 0.85, 3: 1 };
    const cx = stage === 0 ? 62 : 60;
    const cy = stage === 0 ? 50 : stage === 1 ? 42 : stage === 2 ? 38 : 34;
    const petalR = stage === 0 ? 5 : stage === 1 ? 6 : stage === 2 ? 9 : 11;
    const petalCount = stage === 0 ? 4 : stage === 1 ? 5 : 6;
    let petals = '';
    for (let i = 0; i < petalCount; i++) {
      const angle = (Math.PI * 2 * i) / petalCount;
      const dist = stage === 0 ? 6 : petalR + 2;
      const px = cx + Math.cos(angle) * dist;
      const py = cy + Math.sin(angle) * dist;
      petals += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${petalR}" fill="${petalColors[stage]}" opacity="${stage === 0 ? 0.6 : 0.9}"/>`;
    }
    return `
      <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <path d="${stems[stage]}" stroke="${petalColors[stage]}" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M60 78 Q46 72 42 82" stroke="${petalColors[stage]}" stroke-width="3" fill="none" stroke-linecap="round" opacity="${leafOpacity[stage]}"/>
        <path d="M62 88 Q76 84 80 94" stroke="${petalColors[stage]}" stroke-width="3" fill="none" stroke-linecap="round" opacity="${leafOpacity[stage]}"/>
        ${petals}
        <circle cx="${cx}" cy="${cy}" r="${stage === 0 ? 4 : 6}" fill="${centerColors[stage]}"/>
      </svg>`;
  }

  function renderFlower(pendingCount) {
    let stage, caption;
    if (pendingCount <= 0) { stage = 0; caption = 'つぶやきが少なくて、花が元気をなくしています'; }
    else if (pendingCount <= 2) { stage = 1; caption = 'つぼみがふくらんできました'; }
    else if (pendingCount <= 5) { stage = 2; caption = '花が咲きはじめました'; }
    else { stage = 3; caption = 'たくさんのつぶやきで満開です'; }
    flowerBox.style.display = 'block';
    flowerBox.innerHTML = flowerSvg(stage) + `<p class="flower-caption">${caption}</p>`;
  }
  function renderAdmin(users) {
    adminList.innerHTML = users.map(u => `
      <div class="admin-row">
        <span class="email">${esc(u.email || '')}<br><span class="status-tag">${u.approved ? '許可済み' : '承認待ち'}</span></span>
        ${u.approved
          ? `<button class="revoke-btn" data-id="${u.id}" data-action="revoke">取り消す</button>`
          : `<button class="approve-btn" data-id="${u.id}" data-action="approve">許可する</button>`}
      </div>
    `).join('') || '<p style="font-size:13px;color:var(--ink-soft);">まだ誰もログインしていません。</p>';
    adminList.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        db.collection('allowed_users').doc(b.dataset.id).update({ approved: b.dataset.action === 'approve' });
      });
    });
  }

  auth.onAuthStateChanged(async user => {
    isAdminViewer = false;
    loginLink.style.display = 'block';
    logoutLink.style.display = 'none';
    pendingBox.style.display = 'none';
    adminPanel.style.display = 'none';
    throwback.innerHTML = '';
    flowerBox.style.display = 'none';
    feed.innerHTML = '';

    if (!user) return;

    logoutLink.style.display = 'block';

    const isAdmin = user.email === ADMIN_EMAIL;
    isAdminViewer = isAdmin;
    const ref = db.collection('allowed_users').doc(user.uid);
    const snap = await ref.get();
    if (!snap.exists) {
      await ref.set({ email: user.email, approved: isAdmin, addedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    const approved = isAdmin || (snap.exists && snap.data().approved);

    loginLink.style.display = 'none';

    if (!approved) {
      pendingBox.style.display = 'block';
      return;
    }

    if (isAdmin) {
      adminPanel.style.display = 'block';
      db.collection('allowed_users').onSnapshot(s => renderAdmin(s.docs.map(d => ({ id: d.id, ...d.data() }))));
    }

    db.collection('posts').orderBy('timestamp', 'desc').limit(500).onSnapshot(snap => {
      const posts = snap.docs.map(d => {
        const data = d.data();
        const ts = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate().getTime() : Date.now();
        return { id: d.id, name: data.name, text: data.text, timestamp: ts };
      });
      renderFeed(posts);
    });
  });
</script>
</body>
</html>
